services:
  postgres17:
    privileged: true
    cgroup: host
    build:
      context: ../..
      dockerfile: tests/container/Containerfile
      args:
        ANSIBLE_CORE_VERSION: "${ANSIBLE_CORE_VERSION:-2.15.13}"
        RHEL_BASE_IMAGE: "${RHEL_BASE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:9.7}"
    volumes:
      - ../..:/workspace:Z
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    command: /sbin/init
