---

# Adjusts role to run in a non-privileged container
pgs17cis_system_is_container: false

# pgs17cis_install_postgresql this is a toggle to have this role do a generic install of PostgreSQL
# it is recommended that you perform the install and setup on your own and then run this role
pgs17cis_install_postgresql: false

# Enable/Disable full sections toggle
# Set to true will run that section, set to false will skip section
pgs17cis_section1: true
pgs17cis_section2: true
pgs17cis_section3: true
pgs17cis_section4: true
pgs17cis_section5: true
pgs17cis_section6: true
pgs17cis_section7: true
pgs17cis_section8: true

pgs17cis_level_1: true
pgs17cis_level_2: true

# Section 1
# Installation and Patches
pgs17cis_rule_1_1: true
pgs17cis_rule_1_2: true
pgs17cis_rule_1_3: true
pgs17cis_rule_1_4: true
pgs17cis_rule_1_5: true
pgs17cis_rule_1_6: true
pgs17cis_rule_1_7: true

# Section 2
# Directory and File Permissions
pgs17cis_rule_2_1: true
pgs17cis_rule_2_2: true
pgs17cis_rule_2_3: true
pgs17cis_rule_2_4: true

# Section 3
# Logging Monitoring and Auditing
pgs17cis_rule_3_1_2: true
pgs17cis_rule_3_1_3: true
pgs17cis_rule_3_1_4: true
pgs17cis_rule_3_1_5: true
pgs17cis_rule_3_1_6: true
pgs17cis_rule_3_1_7: true
pgs17cis_rule_3_1_8: true
pgs17cis_rule_3_1_9: true
pgs17cis_rule_3_1_10: true
pgs17cis_rule_3_1_11: true
pgs17cis_rule_3_1_12: true
pgs17cis_rule_3_1_13: true
pgs17cis_rule_3_1_14: true
pgs17cis_rule_3_1_15: true
pgs17cis_rule_3_1_16: true
pgs17cis_rule_3_1_17: true
pgs17cis_rule_3_1_18: true
pgs17cis_rule_3_1_19: true
pgs17cis_rule_3_1_20: true
pgs17cis_rule_3_1_21: true
pgs17cis_rule_3_1_22: true
pgs17cis_rule_3_1_23: true
pgs17cis_rule_3_1_24: true
pgs17cis_rule_3_1_25: true
pgs17cis_rule_3_1_26: true
pgs17cis_rule_3_2: true

# Section 4
# User Access and Authorization
pgs17cis_rule_4_1: true
pgs17cis_rule_4_2: true
pgs17cis_rule_4_3: true
pgs17cis_rule_4_4: true
pgs17cis_rule_4_5: true
pgs17cis_rule_4_6: true
pgs17cis_rule_4_7: true
pgs17cis_rule_4_8: true
pgs17cis_rule_4_9: true

# Section 5
# Connection and Login
pgs17cis_rule_5_1: true
pgs17cis_rule_5_2: true
pgs17cis_rule_5_3: true
pgs17cis_rule_5_4: true
pgs17cis_rule_5_5: true
pgs17cis_rule_5_6: true

# Section 6
# PostgreSQL Settings
pgs17cis_rule_6_1: true
pgs17cis_rule_6_2: true
pgs17cis_rule_6_3: true
pgs17cis_rule_6_4: true
pgs17cis_rule_6_5: true
pgs17cis_rule_6_6: true
pgs17cis_rule_6_7: true
pgs17cis_rule_6_8: true
pgs17cis_rule_6_9: true
pgs17cis_rule_6_10: true
pgs17cis_rule_6_11: true

# Section 7
# Replication
pgs17cis_rule_7_1: true
pgs17cis_rule_7_2: true
pgs17cis_rule_7_3: true
pgs17cis_rule_7_4: true
pgs17cis_rule_7_5: true

# Section 8
# Special Configuration Considerations
pgs17cis_rule_8_1: true
pgs17cis_rule_8_2: true
pgs17cis_rule_8_3: true

# Role vars - Global
# pgs17cis_pgs17_usr is the configured postgres user
pgs17cis_pgs17_usr: postgres
# pgs17cis_postgres_user_pw is the password for the postgres user. This is only used in the prelim task to install PostgreSQL 12
# DO NOT USE PASSWORDS IN PLAIN TEXT
# If you are using this role to initially install PostgreSQL 12 it is recommended to use a pw tool like vault
pgs17cis_postgres_user_pw: letmein

# pgs17cis_pgs17_usr_home_dir is the home directory of the pgs17cis_pgs17_usr user directory
pgs17cis_pgs17_usr_home_dir: "{{ pgs17cis_pgs17_usr_home_dir_get.stdout }}"

# pgs17cis_config_file_get is the location of the postgresql.config file
# This is gathered from a prelim task
pgs17cis_config_file: "{{ pgs17cis_config_file_get.stdout }}"
# pgs17cis_hba_config_file is the location of the pg_hba.conf file
# This is gathered from a prelim task
pgs17cis_hba_config_file: "{{ pgs17cis_hba_config_file_get.stdout }}"

# Vars for enabling FIPS 140-2, control(s) 6.7
pgs17cis_boot_part: "{{ pgs17cis_prelim_boot_part.stdout }}"
pgs17cis_machine_uses_uefi: "{{ pgs17cis_prelim_sys_firmware_efi.stat.exists }}"
pgs17cis_grub_cfg_path: "{{ pgs17cis_machine_uses_uefi | ternary('/boot/efi/EFI/' ~ (ansible_distribution | lower) ~ '/grub.cfg', '/boot/grub2/grub.cfg') }}"

# pgs17cis_postgresql_service is the name of the PostgreSQL service.
# The name postgresql-17 is a general default for RHEL based systems and posgresql for Ubuntu based systems
# but this allows for customization of service name if needed. There is a prelim task to set this automatically to the default name
pgs17cis_postgresql_service: "{{ pgs17cis_postgresql_service_auto }}"

# This is where the postgresql package installed binaries
pgs17cis_pgspackage_bin_dir: "/usr/pgsql-17/bin"

# Role vars - Sections
# Section 1
# 1.3
# pgs17cis_db_data_dir_ub is the data directory for the database cluster. This is for Ubuntu only
# If you have this role installing PostgreSQL this will be used for the initdb actions in that configuration
pgs17cis_db_data_dir_ub: /usr/local/pgsql/data

# Section 2
# 2.1
# pgs17cis_umask_value is the value for the PostgreSQL users umask settings
# The value must be 0077 or more restrictive
pgs17cis_umask_value: "077"

# Section 3
# 3.1.2
# pgs17cis_log_destination is the log destination configured for PostgreSQL
# PostgreSQL supports several methods for logging server messages, including stderr, csvlog and syslog
# One of these destinations should be et for server log output
pgs17cis_log_destination: stderr

# 3.1.3
# pgs17cis_logging_collector is a background process that captures log messages sent to stderr and redirects
# them into log files. The logging_collector setting must be enabled in order for this process to run.
pgs17cis_logging_collector: "on"

# 3.1.4
# pgs17cis_log_directory is the directory logs are written to
# The default value is log, which is relative to the clusters data directory.
# To use absolute paths start the value with a /, /var/log/pg_log for example
pgs17cis_log_directory: /var/log/postgres

# 3.1.5
# pgs17cis_log_filename is the file name pattern for log files
# The value is treated as a strftime pattern
pgs17cis_log_filename: postgresql-%a.log

# 3.1.6
# pgs17cis_log_file_mode is the permissions set to the log files when created
# The permissions should be set to allow only the necessary access to authorized personnel.
# In most cases 600 is the best setting, but 640 is another common one as well
pgs17cis_log_file_mode: 600

# 3.1.7
# pgs17cis_log_truncate_on_rotation enables the log_truncate_on_rotation setting when
# logging_collector is enabled causes PostgreSQL to truncate (overwrite) existing log files
# with the same name during log rotation instead of appending to them.
pgs17cis_log_truncate_on_rotation: "on"

# 3.1.8
# pgs17cis_log_file_age is the duration to keep a log file
# Please set this to an acceptable value
pgs17cis_log_file_age: 1d

# 3.1.9
# pgs17cis_log_rotation_size is the max size of an individual log file. Once this size is reached the automatic log file rotation will occur
# To conform to CIS standards this value needs to be larger than zero
pgs17cis_log_rotation_size: 1GB

# 3.1.10
# pgs17cis_syslog_facility is the syslog "facility" to be used when logging to syslog is enabled.
# Possible values are LOCAL0, LOCAL1, through LOCAL7
pgs17cis_syslog_facility: LOCAL1

# 3.1.11
# pgs17cis_syslog_sequence_numbers is the program used to ensure that the syslog_sequence_numbers is enabled.
pgs17cis_syslog_sequence_numbers: "on"

# 3.1.12
# pgs17cis_syslog_split_messages is the program used to to confirm that long log messages are split when logging to Syslog.
pgs17cis_syslog_split_messages: "on"

# 3.1.13
# pgs17cis_syslog_ident is the program name used to identify PostgreSQL messages in rsyslog logs
pgs17cis_syslog_ident: postgres

# 3.1.14
# pgs17cis_log_min_messages specifies the warning levels that are written to the server log.
# Options are DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, PANIC
# The list above is in order from most chatty (DEBUG5) to practically mute (PANIC). The level WARNING is considered best practice unless indicated otherwise.
pgs17cis_log_min_messages: warning

# 3.1.15
# pgs17cis_log_min_error_statement is the value the rate at which all SQL statements generating errors will be logged at
# Options are DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, PANIC
# The list above are in order from most chatty (DEBUG5) to practically mute (PANIC). The level ERROR is considered best practice unless indicated otherwise.
pgs17cis_log_min_error_statement: error

# 3.1.16
# pgs17cis_debug_print_parse is the program name used to disable printing the resulting parse tree for each executed query.
pgs17cis_debug_print_parse: "off"

# 3.1.17
# pgs17cis_debug_print_rewritten is the program name used to enable printing the query rewriter output for each executed query.
pgs17cis_debug_print_rewritten: "off"


# 3.1.18
# pgs17cis_debug_print_plan is the program name used to enable printing the execution plan for each executed query.
# These messages are emitted at the LOG message level.
pgs17cis_debug_print_plan: "off"

# 3.1.19
# pgs17cis_debug_pretty_print is the program name used to making the messages produced by
# debug_print_parse, debug_print_rewritten, or debug_print_plan making them significantly easier to read.
pgs17cis_debug_pretty_print: "on"

# 3.1.20
# pgs17cis_log_connections is the program name used to Enabling the log_connections setting causes each
# attempted connection to the server to be logged, as well as successful completion of client authentication.
pgs17cis_log_connections: "on"

# 3.1.21
# pgs17cis_log_disconnections is the program name used to Enabling the log_disconnections setting logs the end of each session, including session duration.
pgs17cis_log_disconnections: "on"

# 3.1.22
# pgs17cis_log_error_verbosity sets the verbosity (amount of detail) of logged messages
# Options are TERSE, DEFAULT, and VERBOSE.
pgs17cis_log_error_verbosity: DEFAULT

# 3.1.23
# pgs17cis_log_hostname enables/disables logging of connecting host names in logs in addition to the IP
# Enabling this could cause non-negligible  performance impacts. It is suggested to leave off, but have given the option to enable if needed
pgs17cis_log_hostname: "off"

# 3.1.24
# pgs17cis_log_line_prefix is the printf style string that is prefixed to each log line
# for this var you must use the single ticks before and after the values
# Example pgs17cis_log_line_prefix: '%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '
pgs17cis_log_line_prefix: '%m [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '

# 3.1.25
# pgs17cis_log_statement specifies the types of SQL statements that are logged
# The values are none, ddl, mod, and all. Value none logs no SQL statements and all logs all SQL statements
# To conform to CIS standards this must NOT be set to none
pgs17cis_log_statement: ddl

# 3.1.26
# pgs17cis_log_timezone is the timezone to use in timestamps within log messages
# This value needs to be set to GMT, UTC, or the timezone defined by your organization's logging policy
pgs17cis_log_timezone: GMT

# 3.2
# pgs17cis_shared_preload_libraries are the shared pre-load libraries
# The value for this variable must list pgaudit, but can have more items and will be comma separated list with no space between items
# Example for multiple items pgs17cis_shared_preload_libraries: pgaudit,somethingelse
pgs17cis_shared_preload_libraries: pgaudit
# pgs17cis_pgaudit_log_types are the pgaudit log types that will be logged
# The options are READ, WRITE, FUNCTION, ROLE, DDL, and MISC. You can also have multiple types listed and separated by a comma with no spaces
# Example pgs17cis_pgaudit_log_types: ddl,write
pgs17cis_pgaudit_log_types: ddl,write
# pgs17cis_pgaudit_configure should be set to true if no other automatic audit setup is active
pgs17cis_pgaudit_configure: false

# Section 4
# 4.2
# pgs17cis_allowed_superusers is the list of authorized super users.
# These are users that should have SUPERUSER, CREATEROLE, CREATEDB, REPLICATION, and/or BYPASSRLS roles
# Please add additional users in list form starting with a dash, as the first user currently is
pgs17cis_allowed_superusers:
    - "{{ pgs17cis_pgs17_usr }}"

# Section 5
# pgs17cis_user_connection_limit should be adjusted to your needs. It will be applied to all users that
# are previously unlimited, and not super users.
pgs17cis_user_connection_limit: 50

# pgs17cis_encrypt_method is the encryption method used for allowing ssl communication with the pgs17cis_pgs17_usr configured user
# md5, scram-sha-256, gss, sspi, pam, ldap, radius, and cert are allowed. Trust, password, and ident methods are NOT allowed
pgs17cis_encrypt_method: scram-sha-256

# Section 6
# 6.8
# pgs17cis_create_selfsigned_cert turns on a prelim task to generate a self-signed certificate
# The prelim task uses these parameters
# (which matches defaults 'openssl req -new -x509 -days 365 -nodes -text -out {{pgs17cis_data_folder }}/server.crt -keyout {{ pgs17cis_data_folder }}/server.key -subj "/CN={{ ansible_nodename }}"'
# If you have your own certificates (self-signed is not best) set this value to false and use the variables below to specify those certificates
pgs17cis_create_selfsigned_cert: true
# pgs17cis_ssl_ciphers are the ciphers to use with ssl. Default config value HIGH:MEDIUM:+3DES:!aNULL
pgs17cis_ssl_ciphers: HIGH:MEDIUM:+3DES:!aNULL
# pgs17cis_ssl_cert_file is the certificate file to use with ssl. Default config value (file used) server.crt
pgs17cis_ssl_cert_file: server.crt
# pgs17cis_ssl_key_file the key file. Default config value (key file used) server.key
pgs17cis_ssl_key_file: server.key
# pgs17cis_password_encryption the encryption method used. Default config value
pgs17cis_password_encryption: scram-sha-256
# pgs17cis_ssl_min_protocol_version force clients to use TLS v1.3 or newer
pgs17cis_ssl_min_protocol_version: TLSv1.3

# Section 7
# 7.1
# pgs17cis_replication_user a user to be given replication rights
# Disable this task if you already have your users configured as desired
pgs17cis_replication_user: replication_user
# pgs17cis_replication_user_pw is the pw for the created replication user
# DO NOT USE PLAIN TEXT PASSWORDS
# It is recommended to use a vaulted pw here, the default pw here is just for testing/example purposes
pgs17cis_replication_user_pw: test1
# pgs17cis_replication_user_enc_method is the encryption method for the replication user in the pg_hba.conf file
pgs17cis_replication_user_enc_method: md5

# 7.2
# pgs17cis_log_replication_commands is the setting causes each attempted replication from the server to be logged.
pgs17cis_log_replication_commands: "on"

# 7.3
# pgs17cis_archive_command is the value for the archive_command feature in postgresql.conf
pgs17cis_archive_command: rsync -e ssh -a %p postgres@remotehost:/var/lib/pgsql/WAL/%f
