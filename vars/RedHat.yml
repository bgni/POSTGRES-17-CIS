---

# Section 1
# 1.1
# get_repo_list is the list of configured repositories to ensure
# packages are obtained from authorized repositories.
get_repo_list: "dnf repolist all | grep -E 'enabled$'"

# get_postgres_binary_list is PostgreSQL packages installed
# on the Operating System to ensure installation of Binary Packages.
get_postgres_binary_list: "dnf info $(rpm -qa|grep postgres) | grep -E '^Name|^Version|^From'"

# 1.2
# get_installed_pgs_related_packages is a list of all packages related to postgres
get_installed_pgs_related_packages: "rpm -q --qf '%{NAME}\n' $(sudo dnf search postgresql|cut -d: -f1|cut -d. -f1) | grep -v 'is not installed'|sort -u"

# 1.4
# pgs17cis_1_4_db_initialize shell command enforces ownership and
# permissions of the data- cluster in PGDATA.
pgs17cis_1_4_db_initialize: 'PGSETUP_INITDB_OPTIONS="-k" /usr/pgsql-12/bin/postgresql-17-setup initdb'

# Section 3
# 3.2
# pgs17cis_3_2_pgaudit_install is the package to install pgAudit
# to ensure the PostgreSQL Audit Extension (pgAudit) is enabled.
pgs17cis_3_2_pgaudit_install: "pgaudit_17"
