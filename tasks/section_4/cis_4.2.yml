---

# Section 4
# User Access and Authorization
- name: "4.2 | PATCH | Ensure sudo is configured correctly"
  block:
      - name: "4.2 | PATCH | Ensure sudo is configured correctly | Configure dba to sudoers"
        ansible.builtin.lineinfile:
            path: /etc/sudoers.d/postgres
            regexp: '^%dba ALL='
            line: '%dba ALL=({{ pgs17cis_pgs17_usr }}) PASSWD: ALL'
            create: true

      - name: "4.2 | PATCH | Ensure sudo is configured correctly | Set file permissions"
        ansible.builtin.file:
            path: /etc/sudoers.d/postgres
            mode: 0600
  when:
      - pgs17cis_rule_4_2
  tags:
      - level1-postgresqlonlinux
      - patch
      - rule_4.2
